                                </div>

                                <!-- 编辑参与者表单 -->
                                <div class="edit-form" v-if="showEditForm">
                                    <h3>编辑参与者</h3>
                                    <form @submit.prevent="updateParticipant">
                                        <div class="form-row">
                                            <div class="form-group">
                                                <label for="edit-name">姓名</label>
                                                <input 
                                                    type="text" 
                                                    id="edit-name" 
                                                    v-model="editingParticipant.name" 
                                                    placeholder="请输入姓名" 
                                                    required
                                                />
                                            </div>
                                            <div class="form-group">
                                                <label for="edit-id">编号</label>
                                                <input 
                                                    type="text" 
                                                    id="edit-id" 
                                                    v-model="editingParticipant.id" 
                                                    placeholder="请输入编号" 
                                                    required
                                                />
                                            </div>
                                            <div class="form-group">
                                                <label for="edit-group">分组</label>
                                                <input 
                                                    type="text" 
                                                    id="edit-group" 
                                                    v-model="editingParticipant.group" 
                                                    placeholder="请输入分组（可选）" 
                                                />
                                            </div>
                                        </div>
                                        <div class="form-actions">
                                            <button type="submit" class="btn-primary">保存</button>
                                            <button type="button" class="btn-secondary" @click="showEditForm = false">取消</button>
                                        </div>
                                    </form>
                                </div>

                                <!-- 导入提示 -->
                                <div class="import-tips" v-if="!showAddForm">
                                    <h4>批量导入提示：</h4>
                                    <ul>
                                        <li>支持 CSV 或 TXT 文件格式</li>
                                        <li>文件内容格式：姓名,编号（每行一条记录）</li>
                                        <li>示例：张三,001</li>
                                        <li>系统会自动去重，避免重复添加</li>
                                    </ul>
                                </div>
                            </div>

                            <!-- 奖项设置 -->
                            <div v-else-if="currentAdminTab === 'awards'">
                                <h2>奖项设置</h2>
                                
                                <!-- 操作按钮区域 -->
                                <div class="action-buttons">
                                    <button class="btn-primary" @click="showAddForm = true">
                                        ➕ 添加奖项
                                    </button>
                                    <button class="btn-danger" @click="clearAllAwards" :disabled="awards.length === 0">
                                        🗑️ 清空所有
                                    </button>
                                </div>

                                <!-- 添加奖项表单 -->
                                <div class="add-form" v-if="showAddForm">
                                    <h3>添加奖项</h3>
                                    <form @submit.prevent="addAward">
                                        <div class="form-row">
                                            <div class="form-group">
                                                <label for="award-name">奖项名称</label>
                                                <input 
                                                    type="text" 
                                                    id="award-name" 
                                                    v-model="newAward.name" 
                                                    placeholder="请输入奖项名称" 
                                                    required
                                                />
                                            </div>
                                            <div class="form-group">
                                                <label for="award-count">获奖人数</label>
                                                <input 
                                                    type="number" 
                                                    id="award-count" 
                                                    v-model.number="newAward.count" 
                                                    placeholder="请输入获奖人数" 
                                                    min="1" 
                                                    required
                                                />
                                            </div>
                                        </div>
                                        <div class="form-row">
                                            <div class="form-group">
                                                <label for="award-level">奖项等级</label>
                                                <select 
                                                    id="award-level" 
                                                    v-model="newAward.level" 
                                                    required
                                                >
                                                    <option value="first">一等奖</option>
                                                    <option value="second">二等奖</option>
                                                    <option value="third">三等奖</option>
                                                    <option value="lucky">幸运奖</option>
                                                </select>
                                            </div>
                                            <div class="form-group">
                                                <label for="award-color">展示颜色</label>
                                                <div class="color-picker">
                                                    <input 
                                                        type="color" 
                                                        id="award-color" 
                                                        v-model="newAward.color" 
                                                    />
                                                    <span class="color-value">{{ newAward.color }}</span>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="form-actions">
                                            <button type="submit" class="btn-primary">添加</button>
                                            <button type="button" class="btn-secondary" @click="showAddForm = false">取消</button>
                                        </div>
                                    </form>
                                </div>

                                <!-- 奖项列表 -->
                                <div class="awards-list">
                                    <h3>奖项列表 ({{ awards.length }}个)</h3>
                                    <div class="awards-grid">
                                        <div 
                                            v-for="award in awards" 
                                            :key="award.id" 
                                            class="award-card"
                                            :style="{ borderLeftColor: award.color }"
                                        >
                                            <div class="award-info">
                                                <h4>{{ award.name }}</h4>
                                                <p>奖项等级：{{ getLevelLabel(award.level) }}</p>
                                                <p>获奖人数：{{ award.count }}名</p>
                                                <p>展示颜色：<span class="color-preview" :style="{ backgroundColor: award.color }"></span> {{ award.color }}</p>
                                            </div>
                                            <div class="award-actions">
                                                <button class="btn-secondary btn-sm" @click="editAward(award)">
                                                    编辑
                                                </button>
                                                <button class="btn-danger btn-sm" @click="removeAward(award.id)">
                                                    删除
                                                </button>
                                            </div>
                                        </div>
                                        <div v-if="awards.length === 0" class="empty-state">
                                            <p>暂无奖项，请添加</p>
                                        </div>
                                    </div>
                                </div>

                                <!-- 编辑奖项表单 -->
                                <div class="edit-form" v-if="showEditForm">
                                    <h3>编辑奖项</h3>
                                    <form @submit.prevent="updateAward">
                                        <div class="form-row">
                                            <div class="form-group">
                                                <label for="edit-award-name">奖项名称</label>
                                                <input 
                                                    type="text" 
                                                    id="edit-award-name" 
                                                    v-model="editingAward.name" 
                                                    placeholder="请输入奖项名称" 
                                                    required
                                                />
                                            </div>
                                            <div class="form-group">
                                                <label for="edit-award-count">获奖人数</label>
                                                <input 
                                                    type="number" 
                                                    id="edit-award-count" 
                                                    v-model.number="editingAward.count" 
                                                    placeholder="请输入获奖人数" 
                                                    min="1" 
                                                    required
                                                />
                                            </div>
                                        </div>
                                        <div class="form-row">
                                            <div class="form-group">
                                                <label for="edit-award-level">奖项等级</label>
                                                <select 
                                                    id="edit-award-level" 
                                                    v-model="editingAward.level" 
                                                    required
                                                >
                                                    <option value="first">一等奖</option>
                                                    <option value="second">二等奖</option>
                                                    <option value="third">三等奖</option>
                                                    <option value="lucky">幸运奖</option>
                                                </select>
                                            </div>
                                            <div class="form-group">
                                                <label for="edit-award-color">展示颜色</label>
                                                <div class="color-picker">
                                                    <input 
                                                        type="color" 
                                                        id="edit-award-color" 
                                                        v-model="editingAward.color" 
                                                    />
                                                    <span class="color-value">{{ editingAward.color }}</span>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="form-actions">
                                            <button type="submit" class="btn-primary">保存</button>
                                            <button type="button" class="btn-secondary" @click="showEditForm = false">取消</button>
                                        </div>
                                    </form>
                                </div>
                            </div>

                            <!-- 分组概率设置 -->
                            <div v-else-if="currentAdminTab === 'groups'">
                                <h2>分组概率设置</h2>
                                <div class="groups-content">
                                    <p>分组概率设置功能开发中...</p>
                                </div>
                            </div>

                            <!-- 历史记录 -->
                            <div v-else-if="currentAdminTab === 'history'">
                                <h2>历史记录</h2>
                                <div class="action-buttons">
                                    <button class="btn-danger" @click="clearHistory" :disabled="history.length === 0">
                                        🗑️ 清空所有记录
                                    </button>
                                </div>
                                <div class="history-list">
                                    <div v-for="record in history" :key="record.id" class="history-item">
                                        <div class="history-info">
                                            <span class="history-winner">{{ record.participantName }}</span>
                                            <span class="history-prize">{{ record.prizeName }}</span>
                                            <span class="history-level">{{ record.levelName }}</span>
                                        </div>
                                        <div class="history-time">{{ formatTime(record.timestamp) }}</div>
                                    </div>
                                    <div v-if="history.length === 0" class="empty-state">
                                        <p>暂无历史记录</p>
                                    </div>
                                </div>
                            </div>
                        </main>
                    </div>
                </div>
            `,
            setup() {
                // 响应式数据
                const currentAdminTab = Vue.ref('participants');
                const participants = Vue.ref([]);
                const awards = Vue.ref([]);
                const history = Vue.ref([]);
                
                // 参与者管理
                const showAddForm = Vue.ref(false);
                const showEditForm = Vue.ref(false);
                const newParticipant = Vue.ref({ name: '', id: '', group: '' });
                const editingParticipant = Vue.ref({ id: '', name: '', group: '' });
                const searchKeyword = Vue.ref('');
                const fileInput = Vue.ref(null);
                
                // 奖项管理
                const newAward = Vue.ref({ name: '', count: 1, level: 'lucky', color: '#e94560' });
                const editingAward = Vue.ref({ id: '', name: '', count: 1, level: 'lucky', color: '#e94560' });

                // 计算属性
                const filteredParticipants = Vue.computed(() => {
                    if (!searchKeyword.value) {
                        return participants.value;
                    }
                    const keyword = searchKeyword.value.toLowerCase();
                    return participants.value.filter(p => 
                        p.name.toLowerCase().includes(keyword) || 
                        p.id.toLowerCase().includes(keyword) ||
                        (p.group && p.group.toLowerCase().includes(keyword))
                    );
                });

                // 生命周期
                Vue.onMounted(() => {
                    loadData();
                });

                // 方法
                const loadData = () => {
                    try {
                        participants.value = storage.get('participants') || [];
                        awards.value = storage.get('awards') || [];
                        history.value = storage.get('history') || [];
                    } catch (error) {
                        console.error('加载数据失败:', error);
                    }
                };

                const saveData = () => {
                    try {
                        storage.set('participants', participants.value);
                        storage.set('awards', awards.value);
                        storage.set('history', history.value);
                    } catch (error) {
                        console.error('保存数据失败:', error);
                    }
                };

                const showAdminTab = (tab) => {
                    currentAdminTab.value = tab;
                    showAddForm.value = false;
                    showEditForm.value = false;
                };

                // 参与者管理方法
                const addParticipant = () => {
                    if (!newParticipant.value.name.trim() || !newParticipant.value.id.trim()) {
                        alert('请填写完整的参与者信息');
                        return;
                    }

                    // 检查是否重复
                    const isDuplicate = participants.value.some(p => p.id === newParticipant.value.id);
                    if (isDuplicate) {
                        alert('该编号的参与者已存在');
                        return;
                    }

                    const participant = {
                        id: newParticipant.value.id.trim(),
                        name: newParticipant.value.name.trim(),
                        group: newParticipant.value.group.trim() || ''
                    };

                    participants.value.push(participant);
                    saveData();

                    newParticipant.value = { name: '', id: '', group: '' };
                    showAddForm.value = false;

                    alert('添加成功！');
                };

                const editParticipant = (participant) => {
                    editingParticipant.value = { ...participant };
                    showEditForm.value = true;
                    showAddForm.value = false;
                };

                const updateParticipant = () => {
                    if (!editingParticipant.value.name.trim() || !editingParticipant.value.id.trim()) {
                        alert('请填写完整的参与者信息');
                        return;
                    }

                    // 检查是否重复（排除当前参与者）
                    const isDuplicate = participants.value.some(p => 
                        p.id === editingParticipant.value.id && p.id !== editingParticipant.value.id
                    );
                    if (isDuplicate) {
                        alert('该编号的参与者已存在');
                        return;
                    }

                    const index = participants.value.findIndex(p => p.id === editingParticipant.value.id);
                    if (index !== -1) {
                        participants.value[index] = {
                            id: editingParticipant.value.id.trim(),
                            name: editingParticipant.value.name.trim(),
                            group: editingParticipant.value.group.trim() || ''
                        };
                        saveData();
                        showEditForm.value = false;
                        alert('更新成功！');
                    }
                };

                const removeParticipant = (id) => {
                    if (confirm('确定要删除该参与者吗？')) {
                        participants.value = participants.value.filter(p => p.id !== id);
                        saveData();
                        alert('删除成功！');
                    }
                };

                const clearAllParticipants = () => {
                    if (confirm('确定要清空所有参与者吗？此操作不可恢复！')) {
                        participants.value = [];
                        saveData();
                        alert('清空成功！');
                    }
                };

                const triggerFileInput = () => {
                    fileInput.value.click();
                };

                const handleFileImport = (event) => {
                    const file = event.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const content = e.target.result;
                            const lines = content.split('\n');
                            const importedParticipants = [];
                            let successCount = 0;
                            let duplicateCount = 0;

                            lines.forEach((line, index) => {
                                const trimmedLine = line.trim();
                                if (!trimmedLine) return;

                                const parts = trimmedLine.split(',');
                                if (parts.length < 2) {
                                    console.warn(`第${index + 1}行格式错误：${line}`);
                                    return;
                                }

                                const name = parts[0].trim();
                                const id = parts[1].trim();
                                const group = parts[2] ? parts[2].trim() : '';

                                if (!name || !id) {
                                    console.warn(`第${index + 1}行缺少信息：${line}`);
                                    return;
                                }

                                // 检查是否重复
                                const isDuplicate = participants.value.some(p => p.id === id) || 
                                                 importedParticipants.some(p => p.id === id);
                                if (isDuplicate) {
                                    duplicateCount++;
                                    return;
                                }

                                importedParticipants.push({ id, name, group });
                                successCount++;
                            });

                            // 添加到参与者列表
                            participants.value = [...participants.value, ...importedParticipants];
                            saveData();

                            // 显示导入结果
                            alert(`导入完成！\n成功添加：${successCount}人\n重复跳过：${duplicateCount}人`);

                            // 重置文件输入
                            event.target.value = '';
                        } catch (error) {
                            console.error('导入文件失败:', error);
                            alert('导入文件失败，请检查文件格式');
                        }
                    };
                    reader.onerror = () => {
                        alert('读取文件失败');
                    };
                    reader.readAsText(file, 'UTF-8');
                };

                // 奖项管理方法
                const addAward = () => {
                    if (!newAward.value.name.trim() || newAward.value.count < 1) {
                        alert('请填写完整的奖项信息');
                        return;
                    }

                    // 检查是否重复
                    const isDuplicate = awards.value.some(a => a.name === newAward.value.name);
                    if (isDuplicate) {
                        alert('该奖项名称已存在');
                        return;
                    }

                    const award = {
                        id: Date.now().toString(),
                        name: newAward.value.name.trim(),
                        count: newAward.value.count,
                        level: newAward.value.level,
                        color: newAward.value.color
                    };

                    awards.value.push(award);
                    saveData();

                    newAward.value = { name: '', count: 1, level: 'lucky', color: '#e94560' };
                    showAddForm.value = false;

                    alert('添加成功！');
                };

                const editAward = (award) => {
                    editingAward.value = { ...award };
                    showEditForm.value = true;
                    showAddForm.value = false;
                };

                const updateAward = () => {
                    if (!editingAward.value.name.trim() || editingAward.value.count < 1) {
                        alert('请填写完整的奖项信息');
                        return;
                    }

                    // 检查是否重复（排除当前奖项）
                    const isDuplicate = awards.value.some(a => 
                        a.name === editingAward.value.name && a.id !== editingAward.value.id
                    );
                    if (isDuplicate) {
                        alert('该奖项名称已存在');
                        return;
                    }

                    const index = awards.value.findIndex(a => a.id === editingAward.value.id);
                    if (index !== -1) {
                        awards.value[index] = { ...editingAward.value };
                        saveData();
                        showEditForm.value = false;
                        alert('更新成功！');
                    }
                };

                const removeAward = (id) => {
                    if (confirm('确定要删除该奖项吗？')) {
                        awards.value = awards.value.filter(a => a.id !== id);
                        saveData();
                        alert('删除成功！');
                    }
                };

                const clearAllAwards = () => {
                    if (confirm('确定要清空所有奖项吗？此操作不可恢复！')) {
                        awards.value = [];
                        saveData();
                        alert('清空成功！');
                    }
                };

                const getLevelLabel = (level) => {
                    const levelMap = {
                        'first': '一等奖',
                        'second': '二等奖',
                        'third': '三等奖',
                        'lucky': '幸运奖'
                    };
                    return levelMap[level] || level;
                };

                const clearHistory = () => {
                    if (confirm('确定要清空所有历史记录吗？')) {
                        history.value = [];
                        saveData();
                        alert('清空成功！');
                    }
                };

                const formatTime = (timestamp) => {
                    const date = new Date(timestamp);
                    return `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
                };

                return {
                    currentAdminTab,
                    participants,
                    awards,
                    history,
                    showAddForm,
                    showEditForm,
                    newParticipant,
                    editingParticipant,
                    searchKeyword,
                    fileInput,
                    newAward,
                    editingAward,
                    filteredParticipants,
                    showAdminTab,
                    addParticipant,
                    editParticipant,
                    updateParticipant,
                    removeParticipant,
                    clearAllParticipants,
                    triggerFileInput,
                    handleFileImport,
                    addAward,
                    editAward,
                    updateAward,
                    removeAward,
                    clearAllAwards,
                    getLevelLabel,
                    clearHistory,
                    formatTime
                };
            }
        };

        // 路由配置
        const routes = [
            { path: '/', component: Home },
            { path: '/admin', component: Admin },
            { path: '/admin/participants', component: Admin },
            { path: '/admin/awards', component: Admin },
            { path: '/admin/groups', component: Admin },
            { path: '/admin/history', component: Admin }
        ];

        const router = VueRouter.createRouter({
            history: VueRouter.createWebHashHistory(),
            routes
        });

        // 创建应用
        const app = Vue.createApp({
            setup() {
                // 春节主题动画样式
                const getFireworkStyle = (n) => {
                    const positions = [
                        { left: '10%', top: '20%' },
                        { left: '85%', top: '15%' },
                        { left: '20%', top: '60%' },
                        { left: '75%', top: '50%' },
                        { left: '50%', top: '30%' }
                    ];
                    const delays = ['0s', '0.5s', '1s', '1.5s', '2s'];
                    const pos = positions[(n - 1) % positions.length];
                    return {
                        left: pos.left,
                        top: pos.top,
                        animationDelay: delays[(n - 1) % delays.length]
                    };
                };

                const getFuStyle = (n) => {
                    const left = (n - 1) * 12 + 5;
                    const delay = (n - 1) * 0.8;
                    const duration = 8 + Math.random() * 4;
                    return {
                        left: `${left}%`,
                        animationDelay: `${delay}s`,
                        animationDuration: `${duration}s`
                    };
                };

                return {
                    getFireworkStyle,
                    getFuStyle
                };
            }
        });
        app.use(router);
        app.mount('#app');
    </script>
</body>
</html>
