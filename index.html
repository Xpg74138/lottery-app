<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>春节联欢抽奖</title>
    <!-- CDN 引入 Vue 3 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.min.js"></script>
    <!-- CDN 引入 Vue Router -->
    <script src="https://cdn.jsdelivr.net/npm/vue-router@4.4.5/dist/vue-router.global.prod.min.js"></script>
    <!-- 统一的 CSS 样式 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(135deg, #8B0000 0%, #DC143C 50%, #8B0000 100%);
            color: #FFD700;
            overflow: hidden;
        }
        
        #app {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #8B0000 0%, #DC143C 50%, #8B0000 100%);
            color: #FFD700;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* 春节主题背景 */
        .spring-festival-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            overflow: hidden;
        }

        /* 红灯笼 */
        .lantern {
            position: absolute;
            top: 20px;
            width: 80px;
            height: 120px;
            animation: swing 3s ease-in-out infinite;
        }

        .lantern-left {
            left: 30px;
        }

        .lantern-right {
            right: 30px;
            animation-delay: 1.5s;
        }

        .lantern-body {
            width: 80px;
            height: 100px;
            background: linear-gradient(180deg, #FF0000 0%, #CC0000 100%);
            border-radius: 40px 40px 20px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.6), inset 0 0 20px rgba(255, 200, 0, 0.3);
            border: 3px solid #FFD700;
        }

        .lantern-text {
            font-size: 40px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .lantern-tassel {
            width: 4px;
            height: 30px;
            background: #FFD700;
            margin: 0 auto;
            position: relative;
        }

        .lantern-tassel::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: -8px;
            width: 20px;
            height: 20px;
            background: #FFD700;
            border-radius: 50%;
        }

        @keyframes swing {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        /* 中国结 */
        .chinese-knot {
            position: absolute;
            font-size: 40px;
            animation: pulse 2s ease-in-out infinite;
        }

        .knot-left {
            left: 120px;
            top: 80px;
        }

        .knot-right {
            right: 120px;
            top: 80px;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* 烟花效果 */
        .fireworks {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .firework {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: firework 3s ease-out infinite;
        }

        .firework::before,
        .firework::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            animation: firework 3s ease-out infinite;
        }

        .firework:nth-child(1) { background: #FFD700; box-shadow: 0 0 10px #FFD700; }
        .firework:nth-child(2) { background: #FF69B4; box-shadow: 0 0 10px #FF69B4; }
        .firework:nth-child(3) { background: #00CED1; box-shadow: 0 0 10px #00CED1; }
        .firework:nth-child(4) { background: #FF6347; box-shadow: 0 0 10px #FF6347; }
        .firework:nth-child(5) { background: #7FFF00; box-shadow: 0 0 10px #7FFF00; }

        @keyframes firework {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            50% {
                transform: scale(20);
                opacity: 0.5;
            }
            100% {
                transform: scale(40);
                opacity: 0;
            }
        }

        /* 飘落的福字 */
        .floating-fu {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .fu-item {
            position: absolute;
            top: -50px;
            font-size: 30px;
            color: rgba(255, 215, 0, 0.6);
            animation: fall linear infinite;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        @keyframes fall {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* 背景图案 */
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(255, 215, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 215, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255, 0, 0, 0.2) 0%, transparent 30%);
            pointer-events: none;
        }
        
        /* 顶部导航 */
        .header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 2px solid #FFD700;
            position: relative;
            z-index: 10;
        }
        
        .title-decoration {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .decoration-item {
            font-size: 30px;
            animation: bounce 1s ease-in-out infinite;
        }
        
        .header h1 {
            font-size: 32px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
            letter-spacing: 8px;
        }
        
        .header nav {
            display: flex;
            gap: 20px;
        }
        
        .header nav a {
            color: #FFD700;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 25px;
            border: 2px solid #FFD700;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        .header nav a:hover {
            background: #FFD700;
            color: #8B0000;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        }
        
        /* 主内容区域 */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px;
            gap: 30px;
            position: relative;
            z-index: 10;
            overflow: hidden;
        }
        
        /* 左侧抽奖区域 */
        .lottery-section {
            flex: 0 0 auto;
            width: 800px;
            height: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        /* 右侧中奖结果区域 */
        .results-section {
            flex: 0 0 auto;
            width: 300px;
            height: 600px;
        }
        
        /* 动画效果 */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        /* 奖项等级选择 */
        .award-level-selection {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            padding: 15px;
            border: 2px solid #FFD700;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .award-level-selection h2 {
            font-size: 18px;
            margin-bottom: 12px;
            color: #FFD700;
            text-align: center;
            line-height: 1.2;
        }

        .level-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .level-buttons button {
            padding: 10px 20px;
            border-radius: 20px;
            background: rgba(255, 215, 0, 0.2);
            color: #FFD700;
            border: 2px solid #FFD700;
            font-size: 15px;
            font-weight: bold;
            transition: all 0.3s ease;
            cursor: pointer;
            white-space: nowrap;
        }

        .level-buttons button:hover:not(:disabled) {
            background: #FFD700;
            color: #8B0000;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        }

        .level-buttons button.active {
            background: #FFD700;
            color: #8B0000;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }

        .level-buttons button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 奖品选择 */
        .prize-selection {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            padding: 15px;
            border: 2px solid #FFD700;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .prize-selection h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #FFD700;
            text-align: center;
            line-height: 1.2;
        }

        .prize-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .prize-item {
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .prize-item:hover:not(.disabled) {
            background: rgba(255, 215, 0, 0.3);
            border-color: #FFD700;
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3);
        }

        .prize-item.active {
            background: #FFD700;
            border-color: #FFD700;
            color: #8B0000;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
        }

        .prize-item.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: rgba(128, 128, 128, 0.2);
        }

        .prize-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .prize-count {
            font-size: 14px;
            opacity: 0.9;
        }

        /* 奖品空状态样式 */
        .prize-empty {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            color: rgba(255, 215, 0, 0.6);
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            border: 2px dashed rgba(255, 215, 0, 0.3);
        }

        .prize-empty-icon {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.6;
        }

        .prize-empty p {
            margin: 5px 0;
            font-size: 16px;
            line-height: 1.4;
        }

        /* 抽奖显示区域 */
        .lottery-display {
            flex: 1;
            min-height: 300px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            border: 3px solid #FFD700;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
        }

        .lottery-display::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(255, 215, 0, 0.1) 50%,
                transparent 70%
            );
            animation: shine 3s ease-in-out infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .display-content {
            position: relative;
            z-index: 1;
            width: 100%;
            padding: 40px;
        }

        /* 滚动效果 */
        .spinning-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinning-names {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .name-item {
            font-size: 28px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            animation: nameFlash 0.1s ease-in-out;
        }

        @keyframes nameFlash {
            0% { opacity: 0.5; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* 中奖结果 */
        .result-container {
            text-align: center;
            animation: resultAppear 0.5s ease-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        @keyframes resultAppear {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .result-badge {
            font-size: 28px;
            color: #FFD700;
            margin-bottom: 30px;
            animation: badgePulse 1s ease-in-out infinite;
        }

        @keyframes badgePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .winner-info {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .winner-name {
            font-size: 64px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 215, 0, 0.7);
            animation: winnerGlow 2s ease-in-out infinite;
            margin: 0;
        }

        @keyframes winnerGlow {
            0%, 100% { text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 215, 0, 0.7); }
            50% { text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5), 0 0 60px rgba(255, 215, 0, 1); }
        }

        /* 多获奖者逐次显示样式 */
        .multi-winners-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
        }

        .multi-winners-badge {
            font-size: 28px;
            color: #FFD700;
            margin-bottom: 20px;
            animation: badgePulse 1s ease-in-out infinite;
        }

        .current-winner-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: winnerSlideIn 0.8s ease-out;
        }

        @keyframes winnerSlideIn {
            0% { 
                opacity: 0; 
                transform: translateY(30px) scale(0.9); 
            }
            50% {
                transform: translateY(-5px) scale(1.02);
            }
            100% { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }

        .current-winner-number {
            font-size: 24px;
            color: rgba(255, 215, 0, 0.8);
            margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 20px;
            border-radius: 20px;
            border: 2px solid rgba(255, 215, 0, 0.5);
        }

        .current-winner-name {
            font-size: 56px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 215, 0, 0.8);
            animation: winnerGlow 2s ease-in-out infinite;
            margin: 0;
        }

        .current-winner-id {
            font-size: 24px;
            color: rgba(255, 215, 0, 0.9);
            margin-top: 15px;
            background: rgba(255, 215, 0, 0.1);
            padding: 5px 15px;
            border-radius: 15px;
        }

        /* 汇总展示样式 */
        .summary-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            animation: summaryAppear 0.8s ease-out;
        }

        @keyframes summaryAppear {
            0% { 
                opacity: 0; 
                transform: scale(0.9); 
            }
            100% { 
                opacity: 1; 
                transform: scale(1); 
            }
        }

        .summary-badge {
            font-size: 32px;
            color: #FFD700;
            margin-bottom: 25px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            animation: badgePulse 1s ease-in-out infinite;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            max-width: 700px;
            width: 100%;
            padding: 0 20px;
        }

        .summary-item {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2) 0%, rgba(255, 165, 0, 0.2) 100%);
            border: 2px solid #FFD700;
            border-radius: 15px;
            padding: 20px 15px;
            text-align: center;
            animation: summaryItemAppear 0.5s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        @keyframes summaryItemAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .summary-item-number {
            font-size: 18px;
            color: rgba(255, 215, 0, 0.9);
            margin-bottom: 8px;
            font-weight: bold;
        }

        .summary-item-name {
            font-size: 28px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 5px;
        }

        .summary-item-id {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }

        .summary-prize-name {
            margin-top: 25px;
            font-size: 24px;
            color: #FFD700;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 30px;
            border-radius: 25px;
            border: 2px solid rgba(255, 215, 0, 0.5);
            animation: summaryPrizeAppear 0.6s ease-out 0.5s forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes summaryPrizeAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 初始状态 */
        .placeholder {
            text-align: center;
        }

        .placeholder-icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: iconBounce 2s ease-in-out infinite;
        }

        @keyframes iconBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .placeholder h3 {
            font-size: 24px;
            color: #FFD700;
            margin-bottom: 10px;
        }

        .placeholder p {
            font-size: 16px;
            color: rgba(255, 215, 0, 0.7);
        }

        /* 控制按钮 */
        .lottery-controls {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .control-button {
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .button-icon {
            font-size: 20px;
        }

        .control-button.start {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #8B0000;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        }

        .control-button.start:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 25px rgba(255, 215, 0, 0.6);
        }

        .control-button.stop {
            background: linear-gradient(135deg, #FF6347 0%, #DC143C 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 99, 71, 0.4);
        }

        .control-button.stop:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 25px rgba(255, 99, 71, 0.6);
        }

        .control-button.reset {
            background: rgba(255, 255, 255, 0.2);
            color: #FFD700;
            border: 2px solid #FFD700;
        }

        .control-button.reset:hover:not(:disabled) {
            background: rgba(255, 215, 0, 0.3);
            transform: translateY(-3px);
        }

        .control-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* 参与人数信息 */
        .participants-info {
            display: flex;
            gap: 30px;
            justify-content: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-label {
            font-size: 14px;
            color: rgba(255, 215, 0, 0.8);
        }

        .info-value {
            font-size: 20px;
            font-weight: bold;
            color: #FFD700;
        }

        /* 右侧中奖结果展示 */
        .results-panel {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            border: 3px solid #FFD700;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }

        .results-header {
            padding: 20px;
            background: rgba(255, 215, 0, 0.2);
            border-bottom: 2px solid #FFD700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .results-header h2 {
            font-size: 20px;
            color: #FFD700;
        }

        .results-count {
            font-size: 14px;
            color: rgba(255, 215, 0, 0.8);
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 12px;
            border-radius: 15px;
        }

        .results-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;

    <script>
        // 音效管理
        const audioManager = {
            sounds: {
                click: new Audio('sounds/click.mp3'),
                goodLuck: new Audio('sounds/goodluck.m4a'),
                win: new Audio('sounds/win.mp3')
            },
            play: function(soundName) {
                const sound = this.sounds[soundName];
                if (sound) {
                    sound.currentTime = 0;
                    sound.play().catch(e => console.log('音效播放失败:', e));
                }
            },
            playGoodLuck: function() {
                const goodLuck = this.sounds.goodLuck;
                if (goodLuck) {
                    goodLuck.loop = false;
                    goodLuck.volume = 0.5; // 音量适中
                    goodLuck.currentTime = 0;
                    goodLuck.play().catch(e => console.log('好运来播放失败:', e));
                }
            },
            stopGoodLuck: function() {
                const goodLuck = this.sounds.goodLuck;
                if (goodLuck) {
                    goodLuck.pause();
                    goodLuck.currentTime = 0;
                }
            }
        };

        // 全局数据存储
        const storage = {
            get: (key) => {
                try {
                    return JSON.parse(localStorage.getItem(key) || 'null');
                } catch (error) {
                    console.error('读取本地存储失败:', error);
                    return null;
                }
            },
            set: (key, value) => {
                try {
                    localStorage.setItem(key, JSON.stringify(value));
                } catch (error) {
                    console.error('保存本地存储失败:', error);
                }
            },
            init: () => {
                if (!storage.get('participants')) {
                    storage.set('participants', []);
                }
                if (!storage.get('awards')) {
                    storage.set('awards', []);
                }
                if (!storage.get('history')) {
                    storage.set('history', []);
                }
            }
        };

        // 初始化本地存储
        storage.init();

        // 奖项等级配置
        const awardLevels = [
            { label: '一等奖', value: 'first', color: '#FF6B6B' },
            { label: '二等奖', value: 'second', color: '#4ECDC4' },
            { label: '三等奖', value: 'third', color: '#45B7D1' },
            { label: '幸运奖', value: 'lucky', color: '#96CEB4' }
        ];

        // 抽奖首页组件
        const Home = {
            template: `
                <div style="display: flex; gap: 30px; align-items: flex-start;">
                    <!-- 左侧抽奖区域 -->
                    <div class="lottery-section">
                        <!-- 奖项等级选择 -->
                        <div class="award-level-selection">
                            <h2>🎁 选择奖项等级</h2>
                            <div class="level-buttons">
                                <button 
                                    v-for="level in awardLevels" 
                                    :key="level.value"
                                    :class="{ active: selectedLevel === level.value }"
                                    @click="selectLevel(level.value)"
                                    :disabled="isSpinning"
                                >
                                    {{ level.label }}
                                </button>
                            </div>
                        </div>

                        <!-- 具体奖品选择 -->
                        <div class="prize-selection">
                            <h3>🎊 选择具体奖品</h3>
                            <div class="prize-list">
                                <div 
                                    v-for="prize in availablePrizes" 
                                    :key="prize.id"
                                    class="prize-item"
                                    :class="{ active: selectedPrize === prize.id, disabled: prize.remaining === 0 }"
                                    @click="selectPrize(prize)"
                                >
                                    <div class="prize-name">{{ prize.name }}</div>
                                    <div class="prize-count">
                                        剩余: {{ prize.remaining }} / {{ prize.count }}
                                    </div>
                                </div>
                                <div v-if="availablePrizes.length === 0" class="prize-empty">
                                    <div class="prize-empty-icon">🎁</div>
                                    <p v-if="!selectedLevel">请先选择奖项等级</p>
                                    <p v-else>当前奖项等级暂无可用奖品</p>
                                </div>
                            </div>
                        </div>

                        <!-- 抽奖显示区域 -->
                        <div class="lottery-display" :class="{ 'has-result': currentResult || isShowingMultiWinners || isShowingSummary }">
                            <div class="display-content">
                                <!-- 滚动效果 -->
                                <div class="spinning-container" v-if="isSpinning">
                                    <div class="spinning-names">
                                        <div v-for="(name, index) in spinningNames" :key="index" class="name-item">
                                            {{ name }}
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- 多获奖者逐次显示 -->
                                <div class="multi-winners-container" v-else-if="isShowingMultiWinners">
                                    <div class="multi-winners-badge">🎉 正在揭晓获奖者 🎉</div>
                                    <div class="current-winner-display" :key="currentWinnerIndex">
                                        <div class="current-winner-number">第 {{ currentWinnerIndex + 1 }} 位</div>
                                        <div class="current-winner-name">{{ multiWinners[currentWinnerIndex].name }}</div>
                                        <div class="current-winner-id">{{ multiWinners[currentWinnerIndex].id }}</div>
                                    </div>
                                </div>
                                
                                <!-- 汇总展示 -->
                                <div class="summary-container" v-else-if="isShowingSummary">
                                    <div class="summary-badge">🏆 获奖名单 🏆</div>
                                    <div class="summary-grid">
                                        <div 
                                            v-for="(winner, index) in multiWinners" 
                                            :key="winner.id" 
                                            class="summary-item"
                                            :style="{ animationDelay: (index * 0.1) + 's' }"
                                        >
                                            <div class="summary-item-number">第 {{ index + 1 }} 位</div>
                                            <div class="summary-item-name">{{ winner.name }}</div>
                                            <div class="summary-item-id">{{ winner.id }}</div>
                                        </div>
                                    </div>
                                    <div class="summary-prize-name">{{ selectedPrizeInfo?.name }}</div>
                                </div>
                                
                                <!-- 单中奖结果 -->
                                <div class="result-container" v-else-if="currentResult">
                                    <div class="result-badge">🎉 恭喜中奖 🎉</div>
                                    <div class="winner-info">
                                        <div class="winner-name">{{ currentResult.name }}</div>
                                    </div>
                                </div>
                                
                                <!-- 初始状态 -->
                                <div class="placeholder" v-else>
                                    <div class="placeholder-icon">🎲</div>
                                    <h3>请选择奖项开始抽奖</h3>
                                    <p>祝您好运！</p>
                                </div>
                            </div>
                        </div>

                        <!-- 控制按钮 -->
                        <div class="lottery-controls">
                            <button 
                                class="control-button start" 
                                @click="startLottery"
                                :disabled="isSpinning || !canStartLottery"
                            >
                                <span class="button-icon">🎯</span>
                                {{ isSpinning ? '抽奖中...' : '开始抽奖' }}
                            </button>
                            <button 
                                class="control-button stop" 
                                @click="stopLottery"
                                :disabled="!isSpinning"
                            >
                                <span class="button-icon">✋</span>
                                停止抽奖
                            </button>
                            <button 
                                class="control-button reset" 
                                @click="resetLottery"
                                :disabled="isSpinning"
                            >
                                <span class="button-icon">🔄</span>
                                重置
                            </button>
                        </div>

                        <!-- 剩余参与人数 -->
                        <div class="participants-info">
                            <div class="info-item">
                                <span class="info-label">剩余参与人数:</span>
                                <span class="info-value">{{ availableParticipants.length }}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">已中奖人数:</span>
                                <span class="info-value">{{ history.length }}</span>
                            </div>
                        </div>
                    </div>

                    <!-- 右侧中奖结果展示 -->
                    <div class="results-section">
                        <div class="results-panel">
                            <div class="results-header">
                                <h2>🏆 中奖榜单</h2>
                                <div class="results-count">共 {{ history.length }} 人</div>
                            </div>
                            
                            <div class="results-list" v-if="history.length > 0">
                                <div 
                                    v-for="(result, index) in sortedHistory" 
                                    :key="result.id" 
                                    class="result-card"
                                    :class="getLevelClass(result.level)"
                                >
                                    <div class="result-rank">{{ index + 1 }}</div>
                                    <div class="result-content">
                                        <div class="result-winner">
                                            <span class="winner-name-small">{{ result.participantName }}</span>
                                            <span class="winner-id-small">{{ result.participantId }}</span>
                                        </div>
                                        <div class="result-prize">
                                            <span class="prize-level-badge">{{ result.levelName }}</span>
                                            <span class="prize-name-small">{{ result.prizeName }}</span>
                                        </div>
                                    </div>
                                    <div class="result-time">{{ formatTime(result.timestamp) }}</div>
                                </div>
                            </div>
                            
                            <div class="empty-results" v-else>
                                <div class="empty-icon">🎊</div>
                                <p>暂无中奖记录</p>
                                <p class="empty-hint">开始抽奖吧！</p>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                // 响应式数据
                const selectedLevel = Vue.ref('');
                const selectedPrize = Vue.ref('');
                const isSpinning = Vue.ref(false);
                const currentResult = Vue.ref(null);
                const spinningNames = Vue.ref([]);
                const spinningInterval = Vue.ref(null);

                // 多获奖者显示相关状态
                const isShowingMultiWinners = Vue.ref(false);
                const isShowingSummary = Vue.ref(false);
                const multiWinners = Vue.ref([]);
                const currentWinnerIndex = Vue.ref(0);
                const multiWinnersInterval = Vue.ref(null);

                // 从本地存储获取数据
                const participants = Vue.ref([]);
                const awards = Vue.ref([]);
                const history = Vue.ref([]);

                // 计算属性
                const availableParticipants = Vue.computed(() => {
                    const winnerIds = history.value.map(h => h.participantId);
                    return participants.value.filter(p => !winnerIds.includes(p.id));
                });

                const canStartLottery = Vue.computed(() => {
                    if (availableParticipants.value.length === 0) return false;
                    if (!selectedLevel.value) return false;
                    if (!selectedPrize.value) return false;
                    return true;
                });

                const availablePrizes = Vue.computed(() => {
                    if (!selectedLevel.value) return [];
                    
                    return awards.value
                        .filter(award => {
                          // 根据奖项名称匹配等级
                          const awardName = award.name.toLowerCase();
                          switch (selectedLevel.value) {
                            case 'first':
                              return awardName.includes('一等奖') || awardName.includes('1等奖');
                            case 'second':
                              return awardName.includes('二等奖') || awardName.includes('2等奖');
                            case 'third':
                              return awardName.includes('三等奖') || awardName.includes('3等奖');
                            case 'lucky':
                              return awardName.includes('幸运奖');
                            default:
                              return false;
                          }
                        })
                        .map(award => {
                            const usedCount = history.value.filter(h => h.awardId === award.id).length;
                            let level = selectedLevel.value;
                            let levelName = awardLevels.find(l => l.value === level)?.label || level;
                            
                            return {
                                ...award,
                                level,
                                remaining: Math.max(0, award.count - usedCount),
                                levelName
                            };
                        })
                        .sort((a, b) => b.remaining - a.remaining);
                });

                const selectedPrizeInfo = Vue.computed(() => {
                    if (!selectedPrize.value) return null;
                    return availablePrizes.value.find(p => p.id === selectedPrize.value);
                });

                const sortedHistory = Vue.computed(() => {
                    return [...history.value].reverse();
                });

                // 生命周期
                Vue.onMounted(() => {
                    loadData();
                });

                // 方法
                const loadData = () => {
                    try {
                        participants.value = storage.get('participants') || [];
                        awards.value = storage.get('awards') || [];
                        history.value = storage.get('history') || [];
                    } catch (error) {
                        console.error('加载数据失败:', error);
                    }
                };

                const saveData = () => {
                    try {
                        storage.set('participants', participants.value);
                        storage.set('awards', awards.value);
                        storage.set('history', history.value);
                    } catch (error) {
                        console.error('保存数据失败:', error);
                    }
                };

                const selectLevel = (level) => {
                    // 播放点击音效
                    audioManager.play('click');
                    selectedLevel.value = level;
                    selectedPrize.value = '';
                    currentResult.value = null;
                    resetMultiWinnersState();
                };

                const selectPrize = (prize) => {
                    if (prize.remaining === 0 || isSpinning.value) return;
                    // 播放点击音效
                    audioManager.play('click');
                    selectedPrize.value = prize.id;
                    currentResult.value = null;
                    resetMultiWinnersState();
                };

                const startLottery = () => {
                    if (!canStartLottery.value) return;
                    
                    // 播放《好运来》
                    audioManager.playGoodLuck();
                    
                    isSpinning.value = true;
                    currentResult.value = null;
                    
                    // 生成滚动名字
                    generateSpinningNames();
                    
                    // 开始滚动动画
                    spinningInterval.value = setInterval(() => {
                        generateSpinningNames();
                    }, 80);
                };

                const stopLottery = () => {
                    if (!isSpinning.value) return;
                    
                    isSpinning.value = false;
                    
                    // 停止滚动动画
                    if (spinningInterval.value) {
                        clearInterval(spinningInterval.value);
                        spinningInterval.value = null;
                    }
                    
                    // 停止播放《好运来》
                    audioManager.stopGoodLuck();
                    
                    // 判断是否为三等奖或幸运奖（多获奖者）
                    if (selectedLevel.value === 'third' || selectedLevel.value === 'lucky') {
                        generateMultiWinnersResult();
                    } else {
                        // 生成单抽奖结果
                        generateLotteryResult();
                    }
                };

                const resetLottery = () => {
                    isSpinning.value = false;
                    currentResult.value = null;
                    spinningNames.value = [];
                    selectedLevel.value = '';
                    selectedPrize.value = '';
                    
                    if (spinningInterval.value) {
                        clearInterval(spinningInterval.value);
                        spinningInterval.value = null;
                    }
                    
                    resetMultiWinnersState();
                };

                // 重置多获奖者显示状态
                const resetMultiWinnersState = () => {
                    isShowingMultiWinners.value = false;
                    isShowingSummary.value = false;
                    multiWinners.value = [];
                    currentWinnerIndex.value = 0;
                    
                    if (multiWinnersInterval.value) {
                        clearInterval(multiWinnersInterval.value);
                        multiWinnersInterval.value = null;
                    }
                };

                const generateSpinningNames = () => {
                    const names = availableParticipants.value.map(p => p.name);
                    if (names.length === 0) return;
                    
                    const spinning = [];
                    for (let i = 0; i < 5; i++) {
                        const randomIndex = Math.floor(Math.random() * names.length);
                        spinning.push(names[randomIndex]);
                    }
                    spinningNames.value = spinning;
                };

                const generateLotteryResult = () => {
                    if (availableParticipants.value.length === 0) {
                        alert('所有参与者都已中奖！');
                        return;
                    }

                    // 随机选择中奖者
                    const randomIndex = Math.floor(Math.random() * availableParticipants.value.length);
                    const winner = availableParticipants.value[randomIndex];
                    const prize = selectedPrizeInfo.value;

                    if (!prize) {
                        alert('奖品信息错误！');
                        return;
                    }

                    // 生成抽奖记录
                    const lotteryRecord = {
                        id: Date.now().toString(),
                        participantId: winner.id,
                        participantName: winner.name,
                        awardId: prize.id,
                        prizeName: prize.name,
                        level: prize.level,
                        levelName: prize.levelName,
                        timestamp: new Date().toISOString()
                    };

                    // 更新本地存储
                    history.value.push(lotteryRecord);
                    saveData();

                    // 播放中奖音效
                    audioManager.play('win');

                    // 更新当前结果
                    currentResult.value = {
                        ...winner,
                        prizeName: prize.name,
                        levelName: prize.levelName
                    };
                };

                // 生成多获奖者结果（三等奖、幸运奖）
                const generateMultiWinnersResult = () => {
                    const prize = selectedPrizeInfo.value;

                    if (!prize) {
                        alert('奖品信息错误！');
                        return;
                    }

                    // 获取需要抽取的人数
                    const winnerCount = Math.min(prize.remaining, availableParticipants.value.length);

                    if (winnerCount === 0) {
                        alert('没有可用的参与者或奖品！');
                        return;
                    }

                    // 随机选择多个中奖者
                    const winners = [];
                    const tempParticipants = [...availableParticipants.value];

                    for (let i = 0; i < winnerCount; i++) {
                        if (tempParticipants.length === 0) break;
                        const randomIndex = Math.floor(Math.random() * tempParticipants.length);
                        const winner = tempParticipants.splice(randomIndex, 1)[0];
                        winners.push(winner);
                    }

                    // 保存中奖者列表
                    multiWinners.value = winners;

                    // 生成抽奖记录并保存
                    const timestamp = new Date().toISOString();
                    winners.forEach((winner, index) => {
                        const lotteryRecord = {
                            id: (Date.now() + index).toString(),
                            participantId: winner.id,
                            participantName: winner.name,
                            awardId: prize.id,
                            prizeName: prize.name,
                            level: prize.level,
                            levelName: prize.levelName,
                            timestamp: timestamp
                        };
                        history.value.push(lotteryRecord);
                    });
                    saveData();

                    // 开始逐次显示动画
                    startMultiWinnersAnimation();
                };

                // 开始多获奖者逐次显示动画
                const startMultiWinnersAnimation = () => {
                    isShowingMultiWinners.value = true;
                    currentWinnerIndex.value = 0;

                    // 播放第一位中奖者音效
                    audioManager.play('win');

                    // 每1秒显示一位中奖者
                    multiWinnersInterval.value = setInterval(() => {
                        currentWinnerIndex.value++;

                        if (currentWinnerIndex.value >= multiWinners.value.length) {
                            // 所有中奖者显示完毕，显示汇总
                            clearInterval(multiWinnersInterval.value);
                            multiWinnersInterval.value = null;

                            // 延迟1秒后显示汇总
                            setTimeout(() => {
                                isShowingMultiWinners.value = false;
                                isShowingSummary.value = true;
                            }, 1000);
                        } else {
                            // 播放下一位中奖者音效
                            audioManager.play('win');
                        }
                    }, 1000);
                };

                const getLevelClass = (level) => {
                    const classMap = {
                        'special': 'level-special',
                        'first': 'level-first',
                        'second': 'level-second',
                        'third': 'level-third',
                        'lucky': 'level-lucky'
                    };
                    return classMap[level] || '';
                };

                const formatTime = (timestamp) => {
                    const date = new Date(timestamp);
                    return `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
                };

                // 春节主题动画样式
                const getFireworkStyle = (n) => {
                    const positions = [
                        { left: '10%', top: '20%' },
                        { left: '85%', top: '15%' },
                        { left: '20%', top: '60%' },
                        { left: '75%', top: '50%' },
                        { left: '50%', top: '30%' }
                    ];
                    const delays = ['0s', '0.5s', '1s', '1.5s', '2s'];
                    const pos = positions[(n - 1) % positions.length];
                    return {
                        left: pos.left,
                        top: pos.top,
                        animationDelay: delays[(n - 1) % delays.length]
                    };
                };

                const getFuStyle = (n) => {
                    const left = (n - 1) * 12 + 5;
                    const delay = (n - 1) * 0.8;
                    const duration = 8 + Math.random() * 4;
                    return {
                        left: `${left}%`,
                        animationDelay: `${delay}s`,
                        animationDuration: `${duration}s`
                    };
                };

                return {
                    // 响应式数据
                    selectedLevel,
                    selectedPrize,
                    isSpinning,
                    currentResult,
                    spinningNames,
                    participants,
                    awards,
                    history,
                    awardLevels,

                    // 多获奖者显示相关状态
                    isShowingMultiWinners,
                    isShowingSummary,
                    multiWinners,
                    currentWinnerIndex,

                    // 计算属性
                    availableParticipants,
                    canStartLottery,
                    availablePrizes,
                    selectedPrizeInfo,
                    sortedHistory,

                    // 方法
                    selectLevel,
                    selectPrize,
                    startLottery,
                    stopLottery,
                    resetLottery,
                    getLevelClass,
                    formatTime,
                    getFireworkStyle,
                    getFuStyle
                };
            }
        };

        // 管理面板组件
        const Admin = {
            template: `
                <div class="admin">
                    <!-- 顶部导航 -->
                    <header class="admin-header">
                        <h1>管理员控制面板</h1>
                        <nav>
                            <router-link to="/">返回抽奖首页</router-link>
                        </nav>
                    </header>

                    <!-- 侧边栏导航 -->
                    <div class="admin-container">
                        <aside class="admin-sidebar">
                            <nav class="sidebar-nav">
                                <button @click="showAdminTab('participants')" class="nav-item" :class="{ active: currentAdminTab === 'participants' }">
                                    <span class="nav-icon">👥</span>
                                    <span class="nav-text">参与者管理</span>
                                </button>
                                <button @click="showAdminTab('awards')" class="nav-item" :class="{ active: currentAdminTab === 'awards' }">
                                    <span class="nav-icon">🏆</span>
                                    <span class="nav-text">奖项设置</span>
                                </button>
                                <button @click="showAdminTab('groups')" class="nav-item" :class="{ active: currentAdminTab === 'groups' }">
                                    <span class="nav-icon">🎯</span>
                                    <span class="nav-text">分组概率设置</span>
                                </button>
                                <button @click="showAdminTab('history')" class="nav-item" :class="{ active: currentAdminTab === 'history' }">
                                    <span class="nav-icon">📋</span>
                                    <span class="nav-text">历史记录</span>
                                </button>
                            </nav>
                        </aside>

                        <!-- 主内容区域 -->
                        <main class="admin-content">
                            <!-- 参与者管理 -->
                            <div v-if="currentAdminTab === 'participants'">
                                <h2>参与者管理</h2>
                                
                                <!-- 操作按钮区域 -->
                                <div class="action-buttons">
                                    <button class="btn-primary" @click="showAddForm = true">
                                        ➕ 手动添加
                                    </button>
                                    <button class="btn-secondary" @click="triggerFileInput">
                                        📁 批量导入
                                    </button>
                                    <button class="btn-danger" @click="clearAllParticipants" :disabled="participants.length === 0">
                                        🗑️ 清空所有
                                    </button>
                                    <input 
                                        type="file" 
                                        ref="fileInput" 
                                        accept=".csv,.txt" 
                                        style="display: none" 
                                        @change="handleFileImport"
                                    />
                                </div>

                                <!-- 手动添加表单 -->
                                <div class="add-form" v-if="showAddForm">
                                    <h3>手动添加参与者</h3>
                                    <form @submit.prevent="addParticipant">
                                        <div class="form-row">
                                            <div class="form-group">
                                                <label for="name">姓名</label>
                                                <input 
                                                    type="text" 
                                                    id="name" 
                                                    v-model="newParticipant.name" 
                                                    placeholder="请输入姓名" 
                                                    required
                                                />
                                            </div>
                                            <div class="form-group">
                                                <label for="id">编号</label>
                                                <input 
                                                    type="text" 
                                                    id="id" 
                                                    v-model="newParticipant.id" 
                                                    placeholder="请输入编号" 
                                                    required
                                                />
                                            </div>
                                            <div class="form-group">
                                                <label for="group">分组</label>
                                                <input 
                                                    type="text" 
                                                    id="group" 
                                                    v-model="newParticipant.group" 
                                                    placeholder="请输入分组（可选）" 
                                                />
                                            </div>
                                        </div>
                                        <div class="form-actions">
                                            <button type="submit" class="btn-primary">添加</button>
                                            <button type="button" class="btn-secondary" @click="showAddForm = false">取消</button>
                                        </div>
                                    </form>
                                </div>

                                <!-- 参与者列表 -->
                                <div class="participants-list">
                                    <h3>参与者列表 ({{ participants.length }}人)</h3>
                                    <div class="search-bar">
                                        <input 
                                            type="text" 
                                            v-model="searchKeyword" 
                                            placeholder="搜索参与者姓名或编号"
                                        />
                                    </div>
                                    <table class="participants-table">
                                        <thead>
                                            <tr>
                                                <th>序号</th>
                                                <th>姓名</th>
                                                <th>编号</th>
                                                <th>分组</th>
                                                <th>操作</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-for="(participant, index) in filteredParticipants" :key="participant.id">
                                                <td>{{ index + 1 }}</td>
                                                <td>{{ participant.name }}</td>
                                                <td>{{ participant.id }}</td>
                                                <td>{{ participant.group || '未分组' }}</td>
                                                <td>
                                                    <button class="btn-secondary btn-sm" @click="editParticipant(participant)">
                                                        编辑
                                                    </button>
                                                    <button class="btn-danger btn-sm" @click="removeParticipant(participant.id)">
                                                        删除
                                                    </button>
                                                </td>
                                            </tr>
                                            <tr v-if="filteredParticipants.length === 0">
                                                <td colspan="5" class="empty-state">
                                                    {{ participants.length === 0 ? '暂无参与者，请添加' : '未找到匹配的参与者' }}
                                                </td>
                                            </tr>
